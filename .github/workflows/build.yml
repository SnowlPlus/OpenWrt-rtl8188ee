name: Build OpenWrt 24.10.6 with RTL8188EE driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h .

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt v24.10.6 and update feeds
        run: |
          # The device kernel vermagic matches the official 24.10.6 release,
          # so use the release tag together with its official config.buildinfo.
          git clone -b v24.10.6 --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add RTL8188EE driver and firmware definitions
        run: |
          cd openwrt
          python3 - << 'PY'
          from pathlib import Path
          import sys

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      print(f"FAIL: anchor not found in {path}: {old[:70]!r}")
                      sys.exit(1)
                  s = s.replace(old, new, 1)
              p.write_text(s)
              print(f"OK: patched {path}")

          patch('package/kernel/mac80211/realtek.mk', [
              ('config-$(call config_package,rtl8192ce) += RTL8192CE\n',
               'config-$(call config_package,rtl8192ce) += RTL8192CE\n'
               'config-$(call config_package,rtl8188ee) += RTL8188EE\n'),
              ('define KernelPackage/rtl8192ce\n',
               'define KernelPackage/rtl8188ee\n'
               '  $(call KernelPackage/mac80211/Default)\n'
               '  TITLE:=Realtek RTL8188EE support\n'
               '  DEPENDS+= +kmod-rtlwifi-pci +rtl8188ee-firmware\n'
               '  FILES:= $(PKG_BUILD_DIR)/drivers/net/wireless/realtek/rtlwifi/rtl8188ee/rtl8188ee.ko\n'
               '  AUTOLOAD:=$(call AutoProbe,rtl8188ee)\n'
               'endef\n\n'
               'define KernelPackage/rtl8192ce\n'),
          ])

          patch('package/kernel/mac80211/Makefile', [
              ('$(eval $(call KernelPackage,mac80211))\n',
               '$(eval $(call KernelPackage,mac80211))\n'
               '$(eval $(call KernelPackage,rtl8188ee))\n'),
          ])

          patch('package/firmware/linux-firmware/realtek.mk', [
              ('$(eval $(call BuildPackage,rtl8188eu-firmware))\n',
               '$(eval $(call BuildPackage,rtl8188eu-firmware))\n\n'
               'Package/rtl8188ee-firmware = $(call Package/firmware-default,RealTek RTL8188EE firmware,,LICENCE.rtlwifi_firmware.txt)\n'
               'define Package/rtl8188ee-firmware/install\n'
               '\t$(INSTALL_DIR) $(1)/lib/firmware/rtlwifi\n'
               '\t$(INSTALL_DATA) $(PKG_BUILD_DIR)/rtlwifi/rtl8188efw.bin $(1)/lib/firmware/rtlwifi\n'
               'endef\n'
               '$(eval $(call BuildPackage,rtl8188ee-firmware))\n'),
          ])

          # Pin the kernel vermagic to the official 24.10.6 x86/64 value so the
          # built kmod's kernel dependency exactly matches the device firmware.
          # Verified from an official kmod's control file:
          #   Depends: kernel (=6.6.127~50daf8372d971124fb3519e8d87e02ae-r1)
          # NOTE: the kmods DIR name is "6.6.127-1-50daf..."; the extra "1-" is
          # a directory/version field and is NOT part of the vermagic hash.
          # Using "1-50daf..." would produce kernel (=6.6.127~1-50daf...-r1)
          # which does NOT match the device -> opkg dependency error.
          Path('vermagic').write_text('50daf8372d971124fb3519e8d87e02ae\n')
          patch('include/kernel-defaults.mk', [
              ("\tgrep '=[ym]' $(LINUX_DIR)/.config.set | LC_ALL=C sort | $(MKHASH) md5 > $(LINUX_DIR)/.vermagic\n",
               "\tcp $(TOPDIR)/vermagic $(LINUX_DIR)/.vermagic\n"),
          ])
          PY

      - name: Configure build
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_PACKAGE_kmod-rtl8188ee=y
          CONFIG_PACKAGE_rtl8188ee-firmware=y
          EOF
          make defconfig
          echo '--- verify config ---'
          grep -E 'CONFIG_TARGET_x86_64|CONFIG_PACKAGE_kmod-rtl8188ee|CONFIG_PACKAGE_rtl8188ee-firmware' .config || true
          if ! grep -q 'CONFIG_PACKAGE_kmod-rtl8188ee=y' .config; then
            echo 'ERROR: kmod-rtl8188ee missing from final config'
            grep -n -i -A8 -B2 'rtl8188ee' tmp/.config-package.in || true
            exit 1
          fi
          grep -q 'CONFIG_PACKAGE_rtl8188ee-firmware=y' .config
          echo '--- injected vermagic ---'
          cat vermagic

      - name: Verify firmware blob is present in linux-firmware tarball
        run: |
          cd openwrt
          make package/linux-firmware/download
          tar -tf dl/linux-firmware-20241110.tar.xz | grep -q 'rtlwifi/rtl8188efw.bin' \
            && echo "OK: rtl8188efw.bin found" \
            || { echo "ERROR: rtl8188efw.bin missing from firmware tarball"; exit 1; }

      - name: Build firmware and packages
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Verify kmod kernel ABI matches device
        run: |
          cd openwrt
          echo "=== built kernel .vermagic ==="
          VERMAGIC=$(find build_dir -name .vermagic -path '*linux-6.6*' | head -1 | xargs cat 2>/dev/null || true)
          echo "$VERMAGIC"
          echo "=== kmod files ==="
          ls bin/targets/x86/64/packages/kmod-*.ipk
          echo "=== rtl8188ee artifacts ==="
          ls bin/targets/x86/64/packages/kmod-rtl8188ee*.ipk
          IPK=$(ls bin/targets/x86/64/packages/kmod-rtl8188ee*.ipk | head -1)
          python3 - "$IPK" << 'PY'
          import sys, io, gzip, tarfile
          ipk = sys.argv[1]
          # Expected EXACT kernel dependency string (from official kmod control):
          WANT = 'kernel (=6.6.127~50daf8372d971124fb3519e8d87e02ae-r1)'
          raw = open(ipk, 'rb').read()

          def control_from_tar(blob):
              tf = tarfile.open(fileobj=io.BytesIO(blob), mode='r:*')
              for m in tf.getmembers():
                  if m.isfile() and m.name.lstrip('./').startswith('control'):
                      return tf.extractfile(m).read().decode('utf-8', 'ignore')
              return ''

          # New ipk = gzip-compressed tar containing control.tar.gz
          ctrl = ''
          try:
              outer = tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw)), mode='r:')
              for m in outer.getmembers():
                  if m.isfile() and 'control.tar' in m.name:
                      ctrl = control_from_tar(outer.extractfile(m).read())
                      break
          except Exception:
              pass
          # Legacy ipk = ar archive
          if not ctrl:
              pos = 8
              while pos + 60 <= len(raw):
                  hdr = raw[pos:pos+60]
                  name = hdr[0:16].decode('ascii','ignore').strip().rstrip('/')
                  try:
                      size = int(hdr[48:58].decode('ascii','ignore').strip())
                  except ValueError:
                      break
                  if name.startswith('control.tar'):
                      ctrl = control_from_tar(raw[pos+60:pos+60+size])
                      break
                  pos += 60 + size + (size % 2)

          deps = ''
          for line in ctrl.splitlines():
              if line.lower().startswith('depends:'):
                  deps = line.split(':', 1)[1].strip()
          print('=== expected kernel dep:', WANT)
          print('=== kmod Depends:', deps)
          if WANT in deps:
              print('OK: kernel ABI dependency matches device exactly -- kmod WILL install')
          else:
              print('ERROR: kernel ABI dependency does NOT match device.')
              print('Do NOT download these artifacts. Share this log.')
              sys.exit(1)
          PY

      - name: Collect packages
        run: |
          mkdir -p artifacts
          for p in kmod-rtl8188ee rtl8188ee-firmware kmod-rtlwifi kmod-rtlwifi-pci kmod-mac80211 kmod-cfg80211; do
            cp openwrt/bin/targets/x86/64/packages/${p}_*.ipk artifacts/ 2>/dev/null || true
          done
          echo '--- collected artifacts ---'
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10.6-rtl8188ee
          path: artifacts/
          if-no-files-found: error
