name: Build OpenWrt 24.10.6 RTL8188EE driver (Official SDK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h .

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd

      - name: Download and extract official OpenWrt SDK
        run: |
          cd $GITHUB_WORKSPACE
          SDK=openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          wget -q "https://downloads.openwrt.org/releases/24.10.6/targets/x86/64/$SDK" \
            -O "$SDK" || \
          wget -q "https://mirrors.cloud.tencent.com/openwrt/releases/24.10.6/targets/x86/64/$SDK" \
            -O "$SDK"
          tar --zstd -xf "$SDK"
          rm -f "$SDK"
          SDKDIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)
          echo "=== SDKDIR=$SDKDIR ==="
          if [ -z "$SDKDIR" ]; then echo "ERROR: SDK directory not found after extract"; exit 1; fi
          mv "$SDKDIR" sdk
          cd sdk
          echo "--- SDK kernel build tree ---"
          find build_dir -path '*linux-6.6.127/.config' -o -path '*linux-6.6.127/Module.symvers'
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add RTL8188EE driver definition
        run: |
          cd $GITHUB_WORKSPACE/sdk
          # SDK only scans packages wired in via feeds (package/Makefile hardcodes
          # package-y += kernel/linux). feeds install -a already linked the base
          # feed's mac80211 into package/feeds/base/mac80211 -- patch THAT in place.
          MAC80211_DIR=$(find package/feeds -name mac80211 | head -1)
          echo "=== MAC80211_DIR=$MAC80211_DIR ==="
          if [ -z "$MAC80211_DIR" ]; then
            echo "ERROR: mac80211 not found under package/feeds"
            find package/feeds -maxdepth 3 -iname '*mac80211*' || true
            exit 1
          fi
          echo "$MAC80211_DIR" > $GITHUB_WORKSPACE/mac80211_dir.txt
          ls "$MAC80211_DIR"/ | head
          python3 - "$MAC80211_DIR" << 'PY'
          from pathlib import Path
          import sys

          mac = sys.argv[1]

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      print(f"FAIL: anchor not found in {path}: {old[:70]!r}")
                      sys.exit(1)
                  s = s.replace(old, new, 1)
              p.write_text(s)
              print(f"OK: patched {path}")

          patch(f'{mac}/realtek.mk', [
              ('config-$(call config_package,rtl8192ce) += RTL8192CE\n',
               'config-$(call config_package,rtl8192ce) += RTL8192CE\n'
               'config-$(call config_package,rtl8188ee) += RTL8188EE\n'),
              ('define KernelPackage/rtl8192ce\n',
               'define KernelPackage/rtl8188ee\n'
               '  $(call KernelPackage/mac80211/Default)\n'
               '  TITLE:=Realtek RTL8188EE support\n'
               '  DEPENDS+= +kmod-rtlwifi-pci\n'
               '  FILES:= $(PKG_BUILD_DIR)/drivers/net/wireless/realtek/rtlwifi/rtl8188ee/rtl8188ee.ko\n'
               '  AUTOLOAD:=$(call AutoProbe,rtl8188ee)\n'
               'endef\n\n'
               'define KernelPackage/rtl8192ce\n'),
          ])

          patch(f'{mac}/Makefile', [
              ('$(eval $(call KernelPackage,mac80211))\n',
               '$(eval $(call KernelPackage,mac80211))\n'
               '$(eval $(call KernelPackage,rtl8188ee))\n'),
          ])

          # Align the opkg Depends string with the official firmware's kernel.
          # The SDK compiles against the official prebuilt kernel headers, so the
          # struct-module ABI already matches; this only pins the vermagic string.
          Path('vermagic').write_text('50daf8372d971124fb3519e8d87e02ae\n')
          patch('include/kernel-defaults.mk', [
              ("\tgrep '=[ym]' $(LINUX_DIR)/.config.set | LC_ALL=C sort | $(MKHASH) md5 > $(LINUX_DIR)/.vermagic\n",
               "\tcp $(TOPDIR)/vermagic $(LINUX_DIR)/.vermagic\n"),
          ])
          PY

      - name: Configure build
        run: |
          cd $GITHUB_WORKSPACE/sdk
          cat > .config << 'EOF'
          CONFIG_PACKAGE_kmod-rtl8188ee=y
          EOF
          make defconfig
          echo '--- verify config ---'
          grep -E 'CONFIG_PACKAGE_kmod-rtl8188ee' .config || true
          if ! grep -q 'CONFIG_PACKAGE_kmod-rtl8188ee=y' .config; then
            echo 'ERROR: kmod-rtl8188ee missing from final config'
            echo '--- rtl8188ee in .config-package.in ---'
            grep -n -i -A8 -B2 'rtl8188ee' tmp/.config-package.in || true
            echo '--- control: rtl8192ce symbol (should exist if mac80211 is scanned) ---'
            grep -n 'PACKAGE_kmod-rtl8192ce' tmp/.config-package.in || true
            exit 1
          fi
          echo '--- rtl8188ee symbol confirmed in .config-package.in ---'
          grep -n 'PACKAGE_kmod-rtl8188ee' tmp/.config-package.in
          echo '--- injected vermagic ---'
          cat vermagic

      - name: Build driver with SDK
        run: |
          cd $GITHUB_WORKSPACE/sdk
          MAC80211_DIR=$(cat $GITHUB_WORKSPACE/mac80211_dir.txt)
          echo "=== build target: $MAC80211_DIR/compile ==="
          make -j$(nproc) "$MAC80211_DIR/compile"

      - name: Verify and collect
        run: |
          cd $GITHUB_WORKSPACE/sdk
          IPK=$(find . -name 'kmod-rtl8188ee*.ipk' | head -1)
          if [ -z "$IPK" ]; then
            echo "ERROR: kmod ipk not produced"
            find . -name '*rtl8188ee*' | head -30
            exit 1
          fi
          echo "=== built ipk: $IPK ==="
          python3 - "$IPK" << 'PY'
          import sys, io, gzip, tarfile
          ipk = sys.argv[1]
          WANT = 'kernel (=6.6.127~50daf8372d971124fb3519e8d87e02ae-r1)'
          raw = open(ipk, 'rb').read()
          def control_from_tar(blob):
              tf = tarfile.open(fileobj=io.BytesIO(blob), mode='r:*')
              for m in tf.getmembers():
                  if m.isfile() and m.name.lstrip('./').startswith('control'):
                      return tf.extractfile(m).read().decode('utf-8','ignore')
              return ''
          ctrl = ''
          try:
              outer = tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw)), mode='r:')
              for m in outer.getmembers():
                  if m.isfile() and 'control.tar' in m.name:
                      ctrl = control_from_tar(outer.extractfile(m).read()); break
          except Exception: pass
          if not ctrl:
              pos = 8
              while pos + 60 <= len(raw):
                  hdr = raw[pos:pos+60]
                  name = hdr[0:16].decode('ascii','ignore').strip().rstrip('/')
                  try: size = int(hdr[48:58].decode('ascii','ignore').strip())
                  except ValueError: break
                  if name.startswith('control.tar'):
                      ctrl = control_from_tar(raw[pos+60:pos+60+size]); break
                  pos += 60 + size + (size % 2)
          deps = ''
          for line in ctrl.splitlines():
              if line.lower().startswith('depends:'):
                  deps = line.split(':', 1)[1].strip()
          print('=== expected kernel dep:', WANT)
          print('=== kmod Depends:', deps)
          if WANT in deps:
              print('OK: kernel ABI dependency matches device exactly')
          else:
              print('WARNING: kernel dep differs; will still upload. Share this log.')
          PY
          mkdir -p artifacts
          cp "$IPK" artifacts/
          echo '--- collected artifacts ---'
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10.6-rtl8188ee-sdk
          path: sdk/artifacts/kmod-rtl8188ee*.ipk
          if-no-files-found: error
